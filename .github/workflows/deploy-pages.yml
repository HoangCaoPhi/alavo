name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Trang tĩnh thuần: không build, không cài dependency — upload thẳng thư mục repo.
permissions:
  contents: read
  pages: write
  id-token: write

# Nhiều lần push liên tiếp: chỉ giữ lần deploy mới nhất.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
